services:
  - type: web
    name: naijacart-api
    runtime: python
    plan: starter
    rootDir: NaijaCart-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    disk:
      name: naijacart-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NAIJACART_DB_PATH
        value: /var/data/naijacart.db
      - key: NAIJACART_REQUIRE_PERSISTENT_STORAGE
        value: "true"
      - key: NAIJACART_PERSISTENT_ROOT
        value: /var/data
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: NAIJACART_ALLOWED_ORIGINS
        sync: false
      - key: NAIJACART_ADMIN_EMAIL
        sync: false
      - key: NAIJACART_ADMIN_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
